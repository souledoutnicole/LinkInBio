      <!-- Contact Form Section -->
      <!-- MAKE THE CONTACT FORM A DROPDOWN SECTOIN 05/19/2026 -->
      <section id="contact" style="margin-top: 40px; text-align: center">
        <h2
          style="
            font-family: &quot;Poppins&quot;, sans-serif;
            color: #ffffff;
            margin-bottom: 20px;
          "
        >
          <!-- FIX /ADD NEW EMAIL SINCE FORUM SUBMIT NO LONGER WORKS NOW 05/19/2026 -->

          Contact Me
        </h2>
        <form
          action="https://formsubmit.co/itstechlady@gmail.com"
          method="POST"
          style="
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
          "
        >
          <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
            style="
              padding: 10px;
              border-radius: 8px;
              border: 1px solid #ccc;
              font-family: &quot;Poppins&quot;, sans-serif;
              font-size: 15px;
            "
          />

          <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
            style="
              padding: 10px;
              border-radius: 8px;
              border: 1px solid #ccc;
              font-family: &quot;Poppins&quot;, sans-serif;
              font-size: 15px;
            "
          />

          <input
            type="text"
            name="subject"
            placeholder="Subject"
            required
            style="
              padding: 10px;
              border-radius: 8px;
              border: 1px solid #ccc;
              font-family: &quot;Poppins&quot;, sans-serif;
              font-size: 15px;
            "
          />

          <textarea
            name="message"
            rows="4"
            placeholder="Your Message"
            required
            style="
              padding: 10px;
              border-radius: 8px;
              border: 1px solid #ccc;
              font-family: &quot;Poppins&quot;, sans-serif;
              font-size: 15px;
            "
          ></textarea>
          <button
            type="submit"
            style="
              padding: 10px;
              border-radius: 8px;
              border: 2px solid rgba(25, 0, 94, 0.8);
              background-color: rgba(25, 0, 94, 0.8);
              color: white;
              font-family: &quot;Poppins&quot;, sans-serif;
              font-size: 15px;
              cursor: pointer;
              transition: all 0.3s ease;
            "
            onmouseover="
              this.style.backgroundColor = 'white';
              this.style.color = 'rgba(25, 0, 94, 0.8)';
            "
            onmouseout="
              this.style.backgroundColor = 'rgba(25, 0, 94, 0.8)';
              this.style.color = 'white';
            "
          >
            Send Message
          </button>
        </form>
      </section>
